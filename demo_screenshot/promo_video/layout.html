<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Notipala Product Tour Layout</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../frontend/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
          format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        color: #102431;
        background: #cfdee9;
        font-family:
          "Geist",
          "PingFang TC",
          "Noto Sans TC",
          sans-serif;
      }

      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 84% 16%, rgba(255, 255, 255, 0.78), transparent 29%),
          radial-gradient(circle at 8% 86%, rgba(235, 247, 255, 0.78), transparent 34%),
          linear-gradient(180deg, #dceaf3 0%, #cfdee9 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.3;
        background-image:
          linear-gradient(rgba(70, 115, 145, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(70, 115, 145, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 90%);
      }

      .decor-map {
        position: absolute;
        top: -60px;
        right: -80px;
        width: 740px;
        height: 520px;
        opacity: 0.14;
      }

      .decor-map path {
        fill: none;
        stroke: #0f77dc;
        stroke-width: 3;
      }

      .decor-map circle {
        fill: #1aa7ff;
      }

      .topbar {
        position: absolute;
        top: 42px;
        right: 80px;
        left: 80px;
        display: flex;
        height: 68px;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 58px;
        height: 58px;
        object-fit: contain;
      }

      .brand-name {
        color: #073b8e;
        font-size: 30px;
        font-weight: 850;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .brand-tagline {
        margin-top: 6px;
        color: #4e6878;
        font-size: 13px;
        font-weight: 560;
        letter-spacing: 0.025em;
      }

      .tour-label {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #587283;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .tour-line {
        width: 76px;
        height: 2px;
        background: linear-gradient(90deg, #1aa7ff, #0f77dc);
      }

      .screen-frame {
        position: absolute;
        top: 152px;
        left: 80px;
        width: 1200px;
        height: 816px;
        border: 1px solid #bfd1dd;
        border-radius: 28px;
        background: rgba(232, 241, 248, 0.94);
        box-shadow:
          0 28px 68px rgba(16, 36, 49, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }

      .screen-slot {
        position: absolute;
        top: 23px;
        left: 23px;
        width: 1154px;
        height: 770px;
        overflow: hidden;
        border: 1px solid rgba(99, 140, 166, 0.22);
        border-radius: 17px;
        background:
          radial-gradient(circle at 50% 50%, rgba(135, 189, 220, 0.16), transparent 42%),
          #d6e5ef;
      }

      .screen-slot::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.52);
        content: "";
      }

      .info-panel {
        position: absolute;
        top: 152px;
        left: 1320px;
        width: 520px;
        height: 816px;
        padding: 42px 42px 38px;
        border: 1px solid #bfd1dd;
        border-radius: 28px;
        background: rgba(252, 251, 248, 0.93);
        box-shadow:
          0 24px 58px rgba(16, 36, 49, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        color: #6e8491;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .title {
        min-height: 108px;
        margin-top: 20px;
        color: #102431;
        font-size: 39px;
        font-weight: 690;
        line-height: 1.18;
        letter-spacing: -0.045em;
        white-space: pre-line;
      }

      .summary {
        min-height: 106px;
        margin-top: 22px;
        color: #345366;
        font-size: 19px;
        font-weight: 520;
        line-height: 1.62;
        letter-spacing: -0.01em;
      }

      .divider {
        height: 1px;
        margin: 23px 0 24px;
        background: linear-gradient(90deg, #bfd1dd, rgba(191, 209, 221, 0.12));
      }

      .bullets {
        display: flex;
        min-height: 178px;
        flex-direction: column;
        gap: 17px;
      }

      .bullet {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        color: #4e6878;
        font-size: 16px;
        font-weight: 560;
        line-height: 1.48;
      }

      .check {
        display: grid;
        width: 21px;
        height: 21px;
        margin-top: 1px;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(145deg, #1aa7ff, #0f77dc);
        box-shadow: 0 6px 14px rgba(15, 119, 220, 0.2);
        font-size: 12px;
        font-weight: 850;
      }

      .tags {
        display: flex;
        min-height: 76px;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 9px;
        margin-top: 14px;
      }

      .tag {
        height: 34px;
        padding: 8px 13px;
        border: 1px solid rgba(79, 135, 173, 0.14);
        border-radius: 999px;
        color: #174d8d;
        background: #e8f1f8;
        font-size: 12px;
        font-weight: 680;
        line-height: 16px;
      }

      .progress {
        position: absolute;
        right: 42px;
        bottom: 32px;
        left: 42px;
      }

      .progress-copy {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #758c99;
        font-size: 11px;
        font-weight: 720;
        letter-spacing: 0.14em;
      }

      .progress-copy strong {
        color: #174d8d;
        font-size: 13px;
      }

      .progress-track {
        position: relative;
        height: 4px;
        margin-top: 13px;
        overflow: hidden;
        border-radius: 99px;
        background: #dce7ed;
      }

      .progress-value {
        width: 25%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1aa7ff, #0f77dc);
        box-shadow: 0 0 14px rgba(26, 167, 255, 0.24);
      }

      .subtitle-safe {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 100px;
        background: linear-gradient(to bottom, rgba(207, 222, 233, 0), rgba(196, 215, 228, 0.62));
      }

      .outro {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.92), transparent 28%),
          radial-gradient(circle at 50% 48%, rgba(92, 178, 226, 0.15), transparent 46%);
      }

      .outro::before,
      .outro::after {
        position: absolute;
        top: 445px;
        width: 420px;
        height: 2px;
        content: "";
        background: linear-gradient(90deg, transparent, rgba(15, 119, 220, 0.48));
      }

      .outro::before {
        right: calc(50% + 170px);
      }

      .outro::after {
        left: calc(50% + 170px);
        transform: scaleX(-1);
      }

      .outro-logo {
        width: 280px;
        height: 280px;
        object-fit: contain;
        filter: drop-shadow(0 25px 35px rgba(34, 84, 116, 0.16));
      }

      .outro-name {
        margin-top: 2px;
        color: #073b8e;
        font-size: 82px;
        font-weight: 860;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .outro-en {
        margin-top: 22px;
        color: #345366;
        font-size: 27px;
        font-weight: 620;
        letter-spacing: -0.015em;
      }

      .outro-zh {
        margin-top: 32px;
        color: #102431;
        font-size: 35px;
        font-weight: 690;
        letter-spacing: -0.035em;
      }

      .stage.is-outro .topbar,
      .stage.is-outro .screen-frame,
      .stage.is-outro .info-panel,
      .stage.is-outro .subtitle-safe {
        display: none;
      }

      .stage.is-outro .outro {
        display: flex;
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="grid"></div>
      <svg class="decor-map" viewBox="0 0 740 520" aria-hidden="true">
        <path d="M370 260 C280 170 210 120 120 100" />
        <path d="M370 260 C460 170 520 120 625 92" />
        <path d="M370 260 C500 280 585 332 666 420" />
        <path d="M370 260 C274 326 220 390 180 470" />
        <circle cx="370" cy="260" r="14" />
        <circle cx="120" cy="100" r="8" />
        <circle cx="625" cy="92" r="8" />
        <circle cx="666" cy="420" r="8" />
        <circle cx="180" cy="470" r="8" />
      </svg>

      <header class="topbar">
        <div class="brand">
          <img src="../../frontend/public/Notipala2-removebg.png" alt="" />
          <div>
            <div class="brand-name">Notipala</div>
            <div class="brand-tagline">Organize knowledge. Connect ideas.</div>
          </div>
        </div>
        <div class="tour-label">
          <span class="tour-line"></span>
          Product tour
        </div>
      </header>

      <section class="screen-frame" aria-label="Product demonstration">
        <div class="screen-slot"></div>
      </section>

      <aside class="info-panel">
        <div class="eyebrow" id="eyebrow">01 · 提問</div>
        <div class="title" id="title">從問題，到可驗證的答案</div>
        <div class="summary" id="summary"></div>
        <div class="divider"></div>
        <div class="bullets" id="bullets"></div>
        <div class="tags" id="tags"></div>
        <div class="progress">
          <div class="progress-copy">
            <span>NOTIPALA WORKFLOW</span>
            <strong id="progressCopy">01 / 04</strong>
          </div>
          <div class="progress-track">
            <div class="progress-value" id="progressValue"></div>
          </div>
        </div>
      </aside>

      <div class="subtitle-safe"></div>

      <section class="outro">
        <img class="outro-logo" src="../../frontend/public/Notipala2-removebg.png" alt="" />
        <div class="outro-name">Notipala</div>
        <div class="outro-en">Organize knowledge. Connect ideas.</div>
        <div class="outro-zh" id="outroSecondary">讓每一次提問，都成為可累積的知識。</div>
      </section>
    </main>

    <script>
      (() => {
        const sceneSets = {
          "zh-tw": [
            {
              eyebrow: "01 · 提問",
              title: "從問題，到\n可驗證的答案",
              summary: "從一句問題開始，答案、證據與知識結構同步成形。",
              bullets: [
                "取得來源支持的回答",
                "展開 Evidence，快速核對依據",
                "Section Map 完成後立即可探索",
              ],
              tags: ["問答", "Evidence", "Section Map"],
            },
            {
              eyebrow: "02 · 上傳",
              title: "上傳檔案，\n建立知識地圖",
              summary: "加入自己的資料，Notipala 會解析內容並轉成可連結的 Sections。",
              bullets: [
                "讀取文件並保留來源",
                "背景建立 Map，不中斷操作",
                "完成後呈現章節與關係",
              ],
              tags: ["Upload", "Ingestion", "Structured Map"],
            },
            {
              eyebrow: "03 · 追問",
              title: "持續追問，\n地圖持續成長",
              summary: "每一次追問都延續既有脈絡，讓 Section Map 增加新的節點與關係。",
              bullets: [
                "保留上一輪研究內容",
                "更新期間仍顯示原有 Map",
                "新答案完成後自動擴充",
              ],
              tags: ["Follow-up", "Context", "Growing Map"],
            },
            {
              eyebrow: "04 · 記憶模式",
              title: "看見回答背後的\n推理路徑",
              summary: "選擇相關 Sections，直接查看答案如何沿著知識路徑形成。",
              bullets: [
                "顯示 Primary Reasoning Path",
                "高光實際使用的 Sections",
                "讓答案可回溯、可解釋",
              ],
              tags: ["Memory Mode", "Reason Path", "Highlights"],
            },
          ],
          en: [
            {
              eyebrow: "01 · ASK & VERIFY",
              title: "From a question to\na verifiable answer",
              summary: "Start with one question. Answers, evidence, and knowledge structure take shape together.",
              bullets: [
                "Get an answer backed by sources",
                "Open Evidence to verify every claim",
                "Explore the completed Section Map",
              ],
              tags: ["Ask", "Evidence", "Section Map"],
            },
            {
              eyebrow: "02 · UPLOAD",
              title: "Upload files.\nBuild the map.",
              summary: "Bring your own material. Notipala turns it into linked, source-aware sections.",
              bullets: [
                "Read documents while preserving sources",
                "Build the map without blocking your work",
                "Connect sections when processing completes",
              ],
              tags: ["Upload", "Ingestion", "Structured Map"],
            },
            {
              eyebrow: "03 · FOLLOW UP",
              title: "Keep asking.\nKeep the map growing.",
              summary: "Every follow-up continues the same context, adding new nodes and relationships to the map.",
              bullets: [
                "Preserve the previous research context",
                "Keep the existing map visible during updates",
                "Expand automatically when answers complete",
              ],
              tags: ["Follow-up", "Context", "Growing Map"],
            },
            {
              eyebrow: "04 · MEMORY MODE",
              title: "See the reasoning\nbehind each answer",
              summary: "Choose relevant sections and see how the answer forms along the knowledge path.",
              bullets: [
                "Show the Primary Reasoning Path",
                "Highlight the sections actually used",
                "Make every answer traceable",
              ],
              tags: ["Memory Mode", "Reason Path", "Highlights"],
            },
            {
              eyebrow: "05 · EXPLORE DETAILS",
              title: "Open the evidence\nbehind every connection",
              summary: "Move from the map into the note behind any section or relationship without losing context.",
              bullets: [
                "Open any node as a Section note",
                "Inspect any edge as a Cross-section note",
                "Return to the map and keep exploring",
              ],
              tags: ["Nodes", "Edges", "Traceability"],
            },
          ],
        };

        const stage = document.getElementById("stage");
        const eyebrow = document.getElementById("eyebrow");
        const title = document.getElementById("title");
        const summary = document.getElementById("summary");
        const bullets = document.getElementById("bullets");
        const tags = document.getElementById("tags");
        const progressCopy = document.getElementById("progressCopy");
        const progressValue = document.getElementById("progressValue");
        const outroSecondary = document.getElementById("outroSecondary");
        let currentLocale = "zh-tw";
        let currentScene = 1;

        window.__setLocale = (locale) => {
          currentLocale = locale === "en" ? "en" : "zh-tw";
          document.documentElement.lang = currentLocale === "en" ? "en" : "zh-Hant";
          outroSecondary.textContent =
            currentLocale === "en"
              ? "Turn every question into knowledge that compounds."
              : "讓每一次提問，都成為可累積的知識。";
          window.__setScene(currentScene);
        };

        window.__setScene = (sceneId) => {
          currentScene = sceneId;
          if (sceneId === "outro") {
            stage.classList.add("is-outro");
            return;
          }

          stage.classList.remove("is-outro");
          const scenes = sceneSets[currentLocale];
          const index = Math.max(0, Math.min(scenes.length - 1, Number(sceneId) - 1));
          const scene = scenes[index];
          eyebrow.textContent = scene.eyebrow;
          title.textContent = scene.title;
          summary.textContent = scene.summary;
          bullets.innerHTML = scene.bullets
            .map((item) => `<div class="bullet"><span class="check">✓</span><span>${item}</span></div>`)
            .join("");
          tags.innerHTML = scene.tags.map((item) => `<span class="tag">${item}</span>`).join("");
          progressCopy.textContent = `${String(index + 1).padStart(2, "0")} / ${String(scenes.length).padStart(2, "0")}`;
          progressValue.style.width = `${((index + 1) / scenes.length) * 100}%`;
        };

        window.__setScene(1);
      })();
    </script>
  </body>
</html>
